<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      var path = location.pathname;
      if (path === '/lifeos' || path.indexOf('/lifeos/') === 0) {
        var base = document.createElement('base');
        base.href = '/lifeos/';
        document.head.appendChild(base);
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LifeOS">
  <meta name="theme-color" content="#000000">
  <title>LifeOS</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
  <link rel="stylesheet" href="css/styles.css?v=45">
  <script src="config.js?v=28"></script>
  <script>
    (function () {
      var expected = (window.LIFEOS_CONFIG && window.LIFEOS_CONFIG.accessToken) || "";
      var parts = location.pathname.replace(/\/+$/, "").split("/").filter(Boolean);
      var got = "";
      if (parts[0] === "lifeos" && parts[1] && parts[1].indexOf(".") === -1) got = parts[1];
      if (!got) got = new URLSearchParams(location.search).get("t") || "";
      if (!expected || got !== expected) {
        document.title = "";
        document.documentElement.style.background = "#000";
        document.addEventListener("DOMContentLoaded", function () {
          document.body.innerHTML = "";
          document.body.style.background = "#000";
        });
      }
    })();
  </script>
</head>
<body>
  <div id="phone">
    <div id="app">
      <div id="chatAscii" class="chat-ascii" hidden>
        <video
          id="chatAsciiVideo"
          src="/hayden-supple/ASCII/ascii-animation.mp4"
          muted
          loop
          playsinline
          webkit-playsinline
          preload="auto"
          disablepictureinpicture
        ></video>
        <canvas id="chatAsciiCanvas"></canvas>
        <div class="chat-ascii-tint"></div>
      </div>
      <div id="splash" class="splash">
        <div class="splash-mark" aria-hidden="true"></div>
        <p class="splash-word">LifeOS</p>
      </div>
      <header class="top" id="topbar" hidden>
        <div>
          <p class="eyebrow" id="eyebrow">LifeOS</p>
          <h1 class="large-title" id="title">Home</h1>
        </div>
        <button class="icon-btn" id="gear" type="button" aria-label="Settings">
          <svg class="ico ico-gear" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/>
            <path d="M12 3.2v2.1M12 18.7v2.1M3.2 12h2.1M18.7 12h2.1M5.8 5.8l1.5 1.5M16.7 16.7l1.5 1.5M18.2 5.8l-1.5 1.5M7.3 16.7l-1.5 1.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </button>
      </header>
      <main id="screen" hidden></main>
      <nav class="tabbar" id="tabbar" hidden aria-label="LifeOS">
        <button type="button" data-route="home" class="tab on">
          <span class="tab-icon">
            <svg class="ico ico-home" width="22" height="22" viewBox="0 0 24 24" fill="none"><path class="roof" d="M4 11.2 12 4.4l8 6.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path class="walls" d="M6.4 10.4V19.2h11.2v-8.8" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path class="door" d="M10.3 19.2v-4.4h3.4v4.4" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          </span>
          Home
        </button>
        <button type="button" data-route="life" class="tab">
          <span class="tab-icon">
            <svg class="ico ico-life" width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 19.2h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path class="b1" d="M7.2 19.2V13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path class="b2" d="M12 19.2V8.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path class="b3" d="M16.8 19.2V11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </span>
          Life
        </button>
        <button type="button" data-route="food" class="tab">
          <span class="tab-icon">
            <svg class="ico ico-food" width="22" height="22" viewBox="0 0 24 24" fill="none"><path class="fork" d="M8 3.4v5.6M6.2 3.4V7M9.8 3.4V7M8 8.6V20.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path class="knife" d="M15.6 3.6c1.7 1.7 1.7 4 0 5.8V20.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </span>
          Food
        </button>
        <button type="button" data-route="macros" class="tab">
          <span class="tab-icon">
            <svg class="ico ico-macro" width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="7.6" stroke="currentColor" stroke-width="1.7"/><path class="hand" d="M12 8.1V12.2l2.7 1.7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          Macros
        </button>
        <button type="button" data-route="chat" class="tab">
          <span class="tab-icon">
            <svg class="ico ico-chat" width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M5.4 16.8 4.6 20l2.9-1.2A7.8 7.8 0 1 0 5.4 16.8Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle class="d1" cx="8.6" cy="11.2" r="0.9" fill="currentColor"/><circle class="d2" cx="12" cy="11.2" r="0.9" fill="currentColor"/><circle class="d3" cx="15.4" cy="11.2" r="0.9" fill="currentColor"/></svg>
          </span>
          Chat
        </button>
      </nav>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
  <script src="js/api.js?v=22"></script>
  <script src="js/app.js?v=45"></script>
</body>
</html>
