<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      var path = location.pathname;
      if (path === '/lifeos' || path.indexOf('/lifeos/') === 0) {
        var base = document.createElement('base');
        base.href = '/lifeos/';
        document.head.appendChild(base);
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LifeOS">
  <meta name="theme-color" content="#000000">
  <title>LifeOS</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
  <link rel="stylesheet" href="css/styles.css?v=27">
  <script src="config.js"></script>
  <script>
    (function () {
      var expected = (window.LIFEOS_CONFIG && window.LIFEOS_CONFIG.accessToken) || "";
      var parts = location.pathname.replace(/\/+$/, "").split("/").filter(Boolean);
      var got = "";
      if (parts[0] === "lifeos" && parts[1] && parts[1].indexOf(".") === -1) got = parts[1];
      if (!got) got = new URLSearchParams(location.search).get("t") || "";
      if (!expected || got !== expected) {
        document.title = "";
        document.documentElement.style.background = "#000";
        document.addEventListener("DOMContentLoaded", function () {
          document.body.innerHTML = "";
          document.body.style.background = "#000";
        });
      }
    })();
  </script>
</head>
<body>
  <div id="phone">
    <div id="app">
      <div id="splash" class="splash">
        <div class="splash-mark" aria-hidden="true"></div>
        <p class="splash-word">LifeOS</p>
      </div>
      <header class="top" id="topbar" hidden>
        <div>
          <p class="eyebrow" id="eyebrow">LifeOS</p>
          <h1 class="large-title" id="title">Home</h1>
        </div>
        <button class="icon-btn" id="gear" type="button" aria-label="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="1.7"/>
            <path d="M19.4 13a7.8 7.8 0 0 0 .1-2l2-1.5-2-3.4-2.4 1a7.7 7.7 0 0 0-1.7-1L15 4h-6l-.4 2.1a7.7 7.7 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.5a7.8 7.8 0 0 0 .1 2l-2 1.5 2 3.4 2.4-1a7.7 7.7 0 0 0 1.7 1L9 20h6l.4-2.1a7.7 7.7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          </svg>
        </button>
      </header>
      <main id="screen" hidden></main>
      <nav class="tabbar" id="tabbar" hidden aria-label="LifeOS">
        <button type="button" data-route="home" class="tab on">
          <span class="tab-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-7H10v7H5a1 1 0 0 1-1-1v-9.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          </span>
          Home
        </button>
        <button type="button" data-route="life" class="tab">
          <span class="tab-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 18V6m0 12h16M8 14v4m4-8v8m4-5v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
          Life
        </button>
        <button type="button" data-route="food" class="tab">
          <span class="tab-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M8 3v8a3 3 0 1 0 6 0V3M5 21h14M12 11v10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
          Food
        </button>
        <button type="button" data-route="macros" class="tab">
          <span class="tab-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5v4.6l3 1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          Macros
        </button>
        <button type="button" data-route="chat" class="tab">
          <span class="tab-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M5 18.5 4 21l3.2-1.4A9 9 0 1 0 5 18.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          </span>
          Chat
        </button>
      </nav>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
  <script src="js/api.js?v=22"></script>
  <script src="js/app.js?v=27"></script>
</body>
</html>
