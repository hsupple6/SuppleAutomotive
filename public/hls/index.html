<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      var path = location.pathname;
      if (path === '/hls' || path.indexOf('/hls/') === 0) {
        var base = document.createElement('base');
        base.href = '/hls/';
        document.head.appendChild(base);
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#0c0b0a" id="themeColor">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>HLS Doctrine</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=7">
  <script src="config.js?v=8"></script>
  <script>
    (function () {
      var expected = (window.HLS_CONFIG && window.HLS_CONFIG.accessToken) || "";
      var parts = location.pathname.replace(/\/+$/, "").split("/").filter(Boolean);
      var got = "";
      if (parts[0] === "hls" && parts[1] && parts[1].indexOf(".") === -1) got = parts[1];
      if (!got) got = new URLSearchParams(location.search).get("t") || "";
      if (!expected || got !== expected) {
        document.title = "";
        document.documentElement.style.background = "#000";
        document.addEventListener("DOMContentLoaded", function () {
          document.body.innerHTML = "";
          document.body.style.background = "#000";
        });
      } else {
        try {
          var theme = localStorage.getItem("hls.theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.dataset.theme = theme;
          } else if (window.matchMedia("(prefers-color-scheme: light)").matches) {
            document.documentElement.dataset.theme = "light";
          } else {
            document.documentElement.dataset.theme = "dark";
          }
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      }
    })();
  </script>
</head>
<body>
  <div id="app" hidden>
    <div class="shell" id="shell">
      <div class="nav-scrim" id="navScrim"></div>
      <aside class="nav" id="nav">
        <div class="nav-head">
          <div>
            <p class="nav-mark">HLS</p>
            <h1 class="nav-title">The Articles</h1>
            <p class="nav-sub">Hayden Leonhard Supple</p>
          </div>
          <button type="button" class="icon-btn nav-close" id="btnNavClose" aria-label="Close articles">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="store-switch" role="tablist" aria-label="Store">
          <button type="button" class="on" data-store="editing" id="tabDrafts">Drafts</button>
          <button type="button" data-store="permanent" id="tabArchive">Archive</button>
        </div>
        <label class="nav-search">
          <span class="sr-only">Search articles</span>
          <input id="search" type="search" placeholder="Search articles" autocomplete="off" spellcheck="false">
        </label>
        <div class="tree" id="tree" role="tree" aria-label="Articles"></div>
        <div class="nav-foot" id="navFoot">
          <button type="button" class="nav-btn" id="btnNew" title="New article">New article</button>
          <button type="button" class="nav-btn ghost" id="btnChild" title="New sub-article" disabled>Sub-article</button>
        </div>
      </aside>

      <section class="desk">
        <header class="chrome">
          <button type="button" class="text-btn" id="btnMenu" aria-label="Articles" aria-expanded="false" aria-controls="nav">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            Articles
          </button>
          <div class="chrome-status">
            <span class="dot" id="saveDot"></span>
            <span id="saveLabel">Ready</span>
          </div>
          <div class="chrome-actions">
            <div class="seg" id="viewSeg">
              <button type="button" class="on" data-view="edit">Write</button>
              <button type="button" data-view="book">Book</button>
            </div>
            <button type="button" class="text-btn" id="btnType" aria-haspopup="dialog">Type</button>
            <button type="button" class="icon-btn" id="btnTheme" aria-label="Toggle theme"></button>
            <button type="button" class="text-btn danger" id="btnDelete" hidden>Delete</button>
            <button type="button" class="text-btn" id="btnPrint">Print</button>
            <div class="publish-wrap">
              <button type="button" class="publish" id="btnPublish">Publish</button>
              <div class="menu" id="publishMenu" hidden>
                <button type="button" data-pub="one">This article</button>
                <button type="button" data-pub="tree">This article and children</button>
                <button type="button" data-pub="all">Entire draft archive</button>
              </div>
            </div>
            <button type="button" class="text-btn" id="btnAi" aria-expanded="false" aria-controls="ai">Ollama</button>
          </div>
        </header>

        <div class="toolbar" id="toolbar" role="toolbar" aria-label="Writing tools"></div>

        <div class="stage" id="stage">
          <div class="paper" id="paper">
            <div class="empty" id="empty"></div>
            <article class="leaf" id="leaf" hidden>
              <p class="leaf-kicker" id="leafKicker"></p>
              <h1 class="leaf-title" id="leafTitle" contenteditable="true" spellcheck="true" data-placeholder="Title"></h1>
              <div class="leaf-body" id="leafBody" contenteditable="true" spellcheck="true" data-placeholder="Write the doctrine…"></div>
              <aside class="leaf-refs" id="leafRefs" hidden></aside>
            </article>
            <div class="book" id="book" hidden></div>
          </div>
        </div>

        <footer class="meta">
          <span id="metaWhere">Drafts</span>
          <span id="metaCount"></span>
          <span id="metaWords"></span>
          <span id="metaTime"></span>
        </footer>
      </section>

      <aside class="ai" id="ai">
        <div class="ai-head">
          <div>
            <p class="nav-mark">Ollama</p>
            <h2 class="nav-title">Counsel</h2>
          </div>
          <div class="ai-head-actions">
            <button type="button" class="text-btn" id="btnAiNew">New chat</button>
            <button type="button" class="icon-btn" id="btnAiClose" aria-label="Close Ollama">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>
        <div class="ai-tools">
          <label class="ai-model">
            <span>Model</span>
            <select id="aiModel"></select>
          </label>
          <label class="pop-check"><input type="checkbox" id="aiWhole"> Whole archive</label>
        </div>
        <div class="ai-log" id="aiLog"></div>
        <div class="ai-compose">
          <p class="ai-hint">Highlight a passage, then ⌘⇧J. It pins a short link, not the whole text.</p>
          <div class="ai-clips" id="aiClips" hidden></div>
          <textarea id="aiPrompt" rows="4" placeholder="Ask about this doctrine…"></textarea>
          <button type="button" class="publish" id="aiSend">Ask</button>
        </div>
      </aside>
    </div>

    <div class="cite-pop" id="citePop" hidden>
      <p class="cite-kicker">Reference <span id="citeNum"></span></p>
      <input id="citeSearch" type="search" placeholder="Search references" autocomplete="off" spellcheck="false">
      <div class="cite-results" id="citeResults"></div>
      <div class="cite-new">
        <input id="citeTitle" type="text" placeholder="Title" autocomplete="off">
        <div class="cite-url-row">
          <input id="citeUrl" type="url" placeholder="https://…" autocomplete="off">
          <button type="button" class="publish" id="citeAdd" title="Add reference">+</button>
        </div>
      </div>
    </div>

    <div class="popover" id="typePop" hidden>
      <p class="pop-label">Measure</p>
      <div class="pop-row">
        <input id="rngMeasure" type="range" min="48" max="88" step="1">
        <span id="lblMeasure"></span>
      </div>
      <p class="pop-label">Size</p>
      <div class="pop-row">
        <input id="rngSize" type="range" min="17" max="26" step="1">
        <span id="lblSize"></span>
      </div>
      <p class="pop-label">Leading</p>
      <div class="pop-row">
        <input id="rngLead" type="range" min="140" max="200" step="2">
        <span id="lblLead"></span>
      </div>
      <label class="pop-check"><input type="checkbox" id="chkJustify"> Justify body</label>
    </div>

    <div class="modal" id="modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h2 id="modalTitle"></h2>
        <p id="modalBody"></p>
        <input id="modalInput" type="text" hidden>
        <div class="modal-actions">
          <button type="button" class="text-btn" id="modalCancel">Cancel</button>
          <button type="button" class="publish" id="modalOk">Confirm</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>
    <div class="banner" id="banner" hidden></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <script src="js/api.js?v=8"></script>
  <script src="js/editor.js?v=7"></script>
  <script src="js/app.js?v=7"></script>
</body>
</html>
